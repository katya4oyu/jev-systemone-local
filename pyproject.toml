[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-systemone-local"
version = "0.1.0"
description = "Local Jev-compatible decision API backed by Laya-MLX"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "laya-mlx>=0.2,<0.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "typesafe-sdk>=0.1,<2"]

[project.scripts]
jev-systemone-local = "jev_systemone_local.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_systemone_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
