[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "systemone-workbench"
version = "0.1.0"
description = "Workbench for System One decision models on Apple Silicon: serve, route, recommend, evaluate and fine-tune"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
    "laya-mlx>=0.2,<0.3",
    "laya-coreml==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "typesafe-sdk>=0.1,<2", "Pillow>=10,<13"]
vision = ["Pillow>=10,<13", "mlx>=0.32,<0.33", "mlx-vlm>=0.7.4,<0.8"]

[project.scripts]
systemone = "systemone_workbench.cli:main"
jev-systemone-local = "systemone_workbench.cli:main"  # former name, kept as an alias

[tool.hatch.build.targets.wheel]
packages = ["src/systemone_workbench"]

[tool.hatch.build.targets.wheel.force-include]
"src/systemone_workbench/vision_demo.html" = "systemone_workbench/vision_demo.html"
"src/systemone_workbench/vision_camera.mjs" = "systemone_workbench/vision_camera.mjs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
